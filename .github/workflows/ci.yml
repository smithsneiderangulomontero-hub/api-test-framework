name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black (check only, no reformatea)
        run: black --check .

  test-local:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - name: Arrancar la API en background
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          sleep 2

      - name: Correr los tests
        run: pytest --html=reports/report.html --self-contained-html

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-local
          path: reports/report.html

  test-container:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - name: Build de la imagen con Podman
        run: podman build -t items-api:ci -f Containerfile .

      - name: Arrancar el contenedor
        run: podman run -d --name items-api --network=host items-api:ci

      - name: Esperar a que la API responda
        run: |
          for i in {1..10}; do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Correr los tests contra el contenedor
        run: pytest --html=reports/report.html --self-contained-html

      - name: Logs del contenedor (por si algo falla)
        if: failure()
        run: podman logs items-api

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-container
          path: reports/report.html
